spring:
  application:
    name: mobility-decision-copilot

server:
  port: ${SERVER_PORT:8080}

mobility:
  local-api:
    enabled: ${MOBILITY_LOCAL_API_ENABLED:false}
  # This branch provides team scaffolding. The old sample endpoint is not a governed product API.
  demo:
    enabled: false
  data:
    directory: ${MOBILITY_DATA_DIR:outputs/MoveInSync - Anonymised Trip-Log Dataset}
  ai:
    # Select exactly one provider: none, sarvam or ollama.
    provider: ${MOBILITY_AI_PROVIDER:none}
    sarvam:
      api-key: ${SARVAM_API_KEY:}
      endpoint: ${SARVAM_ENDPOINT:https://api.sarvam.ai/v1/chat/completions}
      model: ${SARVAM_MODEL:sarvam-105b}
      timeout: ${SARVAM_TIMEOUT:30s}
      max-prompt-chars: 24000
    agent:
      role: ${MOBILITY_AGENT_ROLE:all}
      max-evidence-items: 64
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:gemma3:4b}
      temperature: ${OLLAMA_TEMPERATURE:0.1}
      timeout: ${OLLAMA_TIMEOUT:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
