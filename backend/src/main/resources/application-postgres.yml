spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/mobility}
    username: ${POSTGRES_USER:mobility}
    password: ${POSTGRES_PASSWORD:mobility}
  flyway:
    enabled: true
    locations: classpath:db/migration

mobility:
  workflow:
    # Selects the PostgreSQL checkpoint, approval, idempotency and audit adapters (see ControlPlaneBeans).
    control-plane: postgres
