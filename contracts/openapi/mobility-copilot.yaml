openapi: 3.1.0
info:
  title: Mobility Decision Copilot — team scaffold
  version: 0.2.0
  description: >
    Only structural capability metadata is implemented. Product endpoints,
    authorization, governed analytics, agents and approvals are team TODOs.
    Shared request/output shapes are in schemas/team-contracts.schema.json.
paths:
  /api/v1/capabilities:
    get:
      summary: Identify the scaffold without claiming a working governed runtime
      responses:
        "200":
          description: Structural metadata; implemented governed capabilities remain empty
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [mode, governedRuntimeReady, agentRoles, workflowNodes, investigationStages, workers, declaredMetrics, implementedGovernedCapabilities, message]
                properties:
                  mode: { const: SCAFFOLD }
                  governedRuntimeReady: { const: false }
                  agentRoles: { type: integer }
                  workflowNodes: { type: integer }
                  investigationStages: { type: integer }
                  workers: { type: integer }
                  declaredMetrics: { type: integer }
                  implementedGovernedCapabilities:
                    type: array
                    items: { type: string }
                  message: { type: string }
