server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/v1/agent/supervisor {
        proxy_pass http://supervisor:8080;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
    }

    location /api/v1/agent/investigator {
        proxy_pass http://investigator:8080;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
    }

    location /api/v1/agent/evidence-critic {
        proxy_pass http://evidence-critic:8080;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
    }

    location /api/v1/agent/briefing-action {
        proxy_pass http://briefing-action:8080;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
