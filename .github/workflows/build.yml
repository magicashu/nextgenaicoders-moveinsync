name: build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Backend unit, contract, quality, security and architecture tests (budget 8 min)
        run: timeout 480 ./mvnw -q -pl backend test
      - run: npm ci
      - name: Frontend type check, tests and production build
        run: timeout 240 sh -c 'npm run build && npm test'
      - name: Secret and artifact hygiene
        run: |
          ! git ls-files | grep -E '(^|/)\.env$|\.duckdb$|\.log$|^frontend/dist/|^backend/target/' || (echo "forbidden artifact committed" && exit 1)
