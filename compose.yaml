services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mobility
      POSTGRES_USER: mobility
      POSTGRES_PASSWORD: mobility
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobility"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      MOBILITY_DATA_DIR: /workspace/data/fixtures
      POSTGRES_URL: jdbc:postgresql://postgres:5432/mobility
      POSTGRES_USER: mobility
      POSTGRES_PASSWORD: mobility
    volumes:
      - ./data/fixtures:/workspace/data/fixtures:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres-data:
